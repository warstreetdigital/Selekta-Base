<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>My Tickets — Selekta Base</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app-container">
      <header class="site-header">
        <div class="header-inner">
          <a href="index.html" class="brand-wordmark">
            <span class="brand-title">SELEKTA <span>BASE</span></span>
            <div class="brand-zw-badge">
              <span class="pip"></span>
              <span>ZW</span>
            </div>
          </a>

          <div class="header-actions">
            <a href="scan.html" class="icon-btn" title="Gate Staff Scanner" aria-label="Gate Staff Scanner">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/></svg>
            </a>
          </div>
        </div>
      </header>

      <main class="main-content">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <div>
            <h2 style="font-size:18px; font-weight:900; color:#20231F;">My Digital Passes</h2>
            <p style="font-size:11px; color:#6F776D;">Stored locally • Ready for offline entrance</p>
          </div>
          <a href="account.html" class="btn-secondary" style="font-size:11px; padding:6px 10px;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <span>Recover</span>
          </a>
        </div>

        <!-- Filter tabs -->
        <div class="filter-pills-row">
          <button type="button" class="filter-pill ticket-filter-btn active" data-filter="all">All Passes</button>
          <button type="button" class="filter-pill ticket-filter-btn" data-filter="valid">Ready for Gate</button>
          <button type="button" class="filter-pill ticket-filter-btn" data-filter="checked_in">Checked In</button>
        </div>

        <!-- Tickets List -->
        <div id="my-tickets-list" style="display:flex; flex-direction:column; gap:12px;"></div>
      </main>

      <!-- High-Contrast QR Code Pass Modal -->
      <div id="qr-pass-modal" class="modal-overlay" role="dialog" aria-modal="true">
        <div class="modal-sheet" style="text-align:center;">
          <div class="modal-header">
            <span style="font-size:11px; font-weight:800; color:#128E5B; text-transform:uppercase;">Official Gate Pass</span>
            <button type="button" id="qr-modal-close-btn" class="icon-btn" aria-label="Close pass">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <div class="modal-body" style="align-items:center;">
            <div style="margin-top:4px;">
              <h3 id="qr-modal-title" style="font-size:15px; font-weight:900; color:#20231F;"></h3>
              <p id="qr-modal-holder" style="font-size:12px; font-weight:700; color:#6F776D; margin-top:2px;"></p>
            </div>

            <!-- Standalone SVG QR Code -->
            <div id="qr-code-svg-box" class="ticket-qr-box"></div>

            <div style="background:#F4F1EA; border:1px solid #E5DFD5; border-radius:12px; padding:8px 14px; width:100%; display:flex; justify-content:space-between; align-items:center; font-size:11px;">
              <span style="color:#6F776D;">Pass Ref:</span>
              <strong id="qr-modal-ref" style="font-family:var(--sb-font-mono); color:#20231F;"></strong>
            </div>

            <p style="font-size:10.5px; color:#128E5B; font-weight:700;">
              ✓ High-contrast offline payload verified for gate camera scanner
            </p>
          </div>
        </div>
      </div>

      <!-- Bottom Navigation -->
      <nav class="bottom-nav" aria-label="Primary Navigation">
        <div class="bottom-nav-inner">
          <a href="index.html" class="nav-item" data-page="home">
            <div class="nav-item-pill">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
              <span class="nav-label">Home</span>
            </div>
          </a>

          <a href="explore.html" class="nav-item" data-page="explore">
            <div class="nav-item-pill">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
              <span class="nav-label">Explore</span>
            </div>
          </a>

          <a href="tickets.html" class="nav-item active" data-page="tickets">
            <div class="nav-item-pill">
              <div style="position:relative;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2z"/></svg>
                <span id="tickets-badge-count" class="nav-badge" style="display:none;">0</span>
              </div>
              <span class="nav-label">My Tickets</span>
            </div>
          </a>

          <a href="account.html" class="nav-item" data-page="account">
            <div class="nav-item-pill">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <span class="nav-label">Account</span>
            </div>
          </a>
        </div>
      </nav>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
