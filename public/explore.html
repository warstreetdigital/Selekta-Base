<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Explore Events — Selekta Base</title>
    <meta name="description" content="Explore live music, festivals, cultural showcases and sound systems across Harare and Zimbabwe on Selekta Base." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Header -->
      <header class="site-header">
        <div class="header-inner">
          <a href="/" class="brand-wordmark">
            <span class="brand-title">SELEKTA <span>BASE</span></span>
            <div class="brand-zw-badge">
              <span class="pip"></span>
              <span>ZW</span>
            </div>
          </a>
        </div>
      </header>

      <!-- Main Content -->
      <main class="main-content">
        <div style="display:flex; flex-direction:column; gap:2px;">
          <h2 style="font-size:18px; font-weight:900; color:#20231F;">Explore Selekta Base</h2>
          <p style="font-size:11px; color:#6F776D;">Official outdoor soundstages, motorsport and festivals</p>
        </div>

        <!-- Search Bar -->
        <div style="position:relative;">
          <svg style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:#6F776D;" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="explore-search-input" class="search-input" style="background:#FAF9F5; padding-left:36px;" placeholder="Search events, venues, cities..." />
        </div>

        <!-- Category Pills -->
        <div class="filter-pills-row">
          <button type="button" class="filter-pill cat-pill active" data-cat="all">All Events</button>
          <button type="button" class="filter-pill cat-pill" data-cat="festivals">Festivals</button>
          <button type="button" class="filter-pill cat-pill" data-cat="music">Music</button>
          <button type="button" class="filter-pill cat-pill" data-cat="nightlife">Nightlife</button>
        </div>

        <!-- Events List -->
        <div id="explore-events-list" style="display:flex; flex-direction:column; gap:14px;"></div>
      </main>

      <!-- Bottom Navigation -->
      <nav class="bottom-nav" aria-label="Primary Navigation">
        <div class="bottom-nav-inner">
          <a href="/" class="nav-item" data-page="home">
            <div class="nav-item-pill">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
              <span class="nav-label">Home</span>
            </div>
          </a>

          <a href="/explore" class="nav-item active" data-page="explore">
            <div class="nav-item-pill">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
              <span class="nav-label">Explore</span>
            </div>
          </a>

          <a href="/tickets" class="nav-item" data-page="tickets">
            <div class="nav-item-pill">
              <div style="position:relative;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2z"/></svg>
                <span id="tickets-badge-count" class="nav-badge" style="display:none;">0</span>
              </div>
              <span class="nav-label">My Tickets</span>
            </div>
          </a>

          <a href="/account" class="nav-item" data-page="account">
            <div class="nav-item-pill">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <span class="nav-label">Account</span>
            </div>
          </a>
        </div>
      </nav>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
