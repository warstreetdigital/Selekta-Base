<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Selekta Base — Event Discovery &amp; Ticketing Zimbabwe</title>
    <meta name="description" content="Discover upcoming events in Zimbabwe, explore by category and location, select ticket phases, and manage digital QR tickets with mobile-first EcoCash checkout." />
    <meta property="og:title" content="Selekta Base — Event Discovery &amp; Ticketing Zimbabwe" />
    <meta property="og:description" content="Discover upcoming events in Zimbabwe, explore by category and location, select ticket phases, and manage digital QR tickets with mobile-first EcoCash checkout." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA Settings -->
    <meta name="theme-color" content="#F7F5F0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Selekta Base" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Master Shared Stylesheet -->
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- 1. Refined Sticky Header -->
      <header class="site-header">
        <div class="header-inner">
          <a href="index.html" class="brand-wordmark">
            <span class="brand-title">SELEKTA <span>BASE</span></span>
            <div class="brand-zw-badge">
              <span class="pip"></span>
              <span>ZW</span>
            </div>
          </a>

          <div class="header-actions">
            <button type="button" id="search-toggle-btn" class="icon-btn" aria-label="Search events" title="Search events">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </button>
          </div>
        </div>

        <!-- Expandable Search Input -->
        <div id="search-expandable-bar" class="search-expandable">
          <svg class="search-icon-left" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="search-input" class="search-input" placeholder="Search official events, venues..." />
          <button type="button" id="search-clear-btn" class="search-clear-btn" aria-label="Clear search">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </header>

      <!-- Main Home View -->
      <main class="main-content">
        <!-- 2. Living Stories Row -->
        <section aria-label="Featured Event Stories">
          <div class="stories-strip">
            <!-- Upcoming: Colourfest -->
            <button type="button" class="story-thumb-btn" data-story-id="story-colour-run-2026">
              <div class="story-ring-outer story-ring-upcoming">
                <div class="story-ring-inner">
                  <div class="story-avatar">
                    <img src="https://pub-e10a28ca38cf452da437555e0f90e288.r2.dev/SelectorBase/Colorrun%20poster.jpg" alt="Colourfest" loading="lazy" />
                    <div class="story-video-badge">
                      <svg width="8" height="8" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    </div>
                  </div>
                </div>
              </div>
              <div class="story-labels">
                <span class="story-title">Colourfest</span>
                <span class="story-status-tag upcoming">Coming Soon</span>
              </div>
            </button>

            <!-- Archive: Oct BlowOut -->
            <button type="button" class="story-thumb-btn" data-story-id="story-blowout-october">
              <div class="story-ring-outer story-ring-archive">
                <div class="story-ring-inner">
                  <div class="story-avatar">
                    <img src="https://pub-e10a28ca38cf452da437555e0f90e288.r2.dev/SelectorBase/Octoberblowout.jpg" alt="Oct BlowOut" loading="lazy" />
                    <span class="archive-accent-pip"></span>
                  </div>
                </div>
              </div>
              <div class="story-labels">
                <span class="story-title">Oct BlowOut</span>
                <span class="story-status-tag archive">Archive</span>
              </div>
            </button>

            <!-- Archive: BlowOut Fest -->
            <button type="button" class="story-thumb-btn" data-story-id="story-blowout-fest">
              <div class="story-ring-outer story-ring-archive">
                <div class="story-ring-inner">
                  <div class="story-avatar">
                    <img src="https://pub-e10a28ca38cf452da437555e0f90e288.r2.dev/SelectorBase/Blowout.jpg" alt="BlowOut Fest" loading="lazy" />
                    <span class="archive-accent-pip"></span>
                  </div>
                </div>
              </div>
              <div class="story-labels">
                <span class="story-title">BlowOut Fest</span>
                <span class="story-status-tag archive">Festival</span>
              </div>
            </button>

            <!-- Archive: 10-Yr Vault -->
            <button type="button" class="story-thumb-btn" data-story-id="story-blowout-vault">
              <div class="story-ring-outer story-ring-archive">
                <div class="story-ring-inner">
                  <div class="story-avatar">
                    <img src="https://pub-e10a28ca38cf452da437555e0f90e288.r2.dev/SelectorBase/Blowouut.jpg" alt="10-Yr Vault" loading="lazy" />
                    <span class="archive-accent-pip"></span>
                  </div>
                </div>
              </div>
              <div class="story-labels">
                <span class="story-title">10-Yr Vault</span>
                <span class="story-status-tag archive">10th Anniv</span>
              </div>
            </button>
          </div>
        </section>

        <!-- 3. Official Event Feed -->
        <section id="event-feed-list" class="event-feed" aria-label="Official Event Feed">
          <!-- Feed dynamically populated by app.js with fallback static cards -->
        </section>
      </main>

      <!-- 4. Pure Full-Screen Social Media Story Viewer (Instagram / WhatsApp Status Style) -->
      <div id="story-viewer-modal" class="story-viewer-modal" role="dialog" aria-modal="true" aria-label="Story Viewer">
        <!-- Top Bar Overlaid: Segmented Progress + Header Meta & Controls -->
        <div class="viewer-top-bar">
          <div class="viewer-progress-segments"></div>
          <div class="viewer-header-info">
            <div class="viewer-profile">
              <div class="viewer-avatar">
                <img src="" alt="" />
              </div>
              <div class="viewer-meta">
                <span class="viewer-title"></span>
                <span class="viewer-status"></span>
              </div>
            </div>

            <div class="viewer-controls">
              <button type="button" id="viewer-mute-btn" class="viewer-btn" aria-label="Toggle sound">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
              </button>
              <button type="button" id="viewer-close-btn" class="viewer-btn" aria-label="Close story">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </button>
            </div>
          </div>
        </div>

        <!-- Full-Screen Media Canvas (Object-Fit: Contain, Dark Background) -->
        <div class="viewer-media-canvas">
          <button type="button" id="viewer-play-overlay" class="viewer-play-overlay" aria-label="Play video">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          </button>
        </div>
      </div>

      <!-- 5. Fixed Bottom Navigation -->
      <nav class="bottom-nav" aria-label="Primary Navigation">
        <div class="bottom-nav-inner">
          <a href="index.html" class="nav-item active" data-page="home">
            <div class="nav-item-pill">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
              <span class="nav-label">Home</span>
            </div>
          </a>

          <a href="explore.html" class="nav-item" data-page="explore">
            <div class="nav-item-pill">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
              <span class="nav-label">Explore</span>
            </div>
          </a>

          <a href="tickets.html" class="nav-item" data-page="tickets">
            <div class="nav-item-pill">
              <div style="position:relative;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2z"/></svg>
                <span id="tickets-badge-count" class="nav-badge" style="display:none;">0</span>
              </div>
              <span class="nav-label">My Tickets</span>
            </div>
          </a>

          <a href="account.html" class="nav-item" data-page="account">
            <div class="nav-item-pill">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <span class="nav-label">Account</span>
            </div>
          </a>
        </div>
      </nav>
    </div>

    <!-- Master Shared JavaScript -->
    <script src="/app.js"></script>
  </body>
</html>
